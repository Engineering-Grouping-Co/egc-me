<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fallback tags for the pre-hydration flash and the "/" redirect
         page (which isn't captured by scripts/prerender.mjs, so it never
         gets a React-rendered <Seo>). Every other route's <Seo> removes
         these via their data-default marker as soon as it mounts, so
         they never end up duplicated in prerendered output. -->
    <meta name="description" content="Engineering Grouping Co. (EGC) — Jeddah-based specialty contractor preparing MRI, CT and PET-CT rooms for Siemens Healthineers, Philips Healthcare and GE Healthcare equipment across Saudi Arabia. Radiation shielding, medical doors, MEP, manufacturing, and software engineering." data-default="true" />
    <meta name="keywords" content="EGC, Engineering Grouping Co, radiation shielding, MRI room construction, medical doors, healthcare MEP, Corian manufacturing, Jeddah, Saudi Arabia" />
    <meta property="og:title" content="EGC | Healthcare Room Preparation Contractor — Jeddah, Saudi Arabia" data-default="true" />
    <meta property="og:description" content="Specialty contractor preparing healthcare rooms for OEM medical imaging equipment across Saudi Arabia — radiation & magnetic shielding, medical doors, specialized MEP, and infection-controlled surfaces." data-default="true" />
    <meta property="og:type" content="website" data-default="true" />
    <meta property="og:url" content="https://egc-me.com/en/" data-default="true" />
    <title data-default="true">EGC | Healthcare Room Preparation Contractor — Jeddah, Saudi Arabia</title>
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
