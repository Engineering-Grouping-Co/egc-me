<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- fonts are self-hosted and declared in src/styles/global.css. They are deliberately not
         preloaded: on a slow phone the preloads delayed the hero photo (LCP) by 150-570 ms. -->

    <!-- Fallback tags for the pre-hydration flash and any route that doesn't render its own <Seo>.
         Every real page's <Seo> removes these (data-default) as soon as it mounts, so they never
         end up duplicated in prerendered output. -->
    <title data-default="true">Healthcare Contractor in Saudi Arabia | Engineering Grouping Co. (EGC)</title>
    <meta
      name="description"
      content="Engineering Grouping Co. (EGC) is a Jeddah healthcare contractor for MRI, CT and PET-CT rooms: radiation shielding, medical doors, MEP and clinical surfaces."
      data-default="true"
    />
    <meta property="og:title" content="Healthcare Contractor in Saudi Arabia | Engineering Grouping Co. (EGC)" data-default="true" />
    <meta property="og:type" content="website" data-default="true" />
    <meta property="og:url" content="https://egc-me.com/" data-default="true" />
    <meta property="og:image" content="https://egc-me.com/og-image.png" data-default="true" />

    <!-- GitHub Pages SPA redirect handler (pairs with public/404.html) -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
